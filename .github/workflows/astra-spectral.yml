name: ASTRA spectral finite certificate (stdlib)
on:
  pull_request:
    paths:
      - "research/eth_repro/spectral_certificate.py"
      - "research/eth_repro/test_spectral_certificate.py"
      - "research/eth_repro/SpectralRankTen.lean"
      - "research/eth_repro/ParametricSpectrum.lean"
      - "research/eth_repro/parametric_spectrum.py"
      - "research/eth_repro/test_parametric_spectrum.py"
      - "research/eth_repro/projected_spectrum.py"
      - "research/eth_repro/test_projected_spectrum.py"
      - "research/eth_repro/ProjectorSpectrum.lean"
      - "research/eth_repro/math_research_engine.py"
      - ".github/workflows/astra-spectral.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spectral-exact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.23.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://elan.lean-lang.org/elan-init.sh -o /tmp/astra-elan.sh
          sh /tmp/astra-elan.sh -y --default-toolchain leanprover/lean4:v4.23.0 --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Lean kernel - exact rank ten spectral certificate
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          lean research/eth_repro/SpectralRankTen.lean
      - name: Independent spectral arithmetic and two adversarial controls
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s research/eth_repro -p 'test_spectral_certificate.py' -v
          python3 research/eth_repro/spectral_certificate.py --output /tmp/astra_spectral_receipt.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          report=json.loads(Path("/tmp/astra_spectral_receipt.json").read_text())
          assert report["computational_certificate_status"] == "PASS", report
          assert report["project_integration_status"] == "PASS", report
          assert report["existing_ASTRA_4096_entry_crosscheck"]["entries_compared"] == 4096
          assert report["spectral"]["equations_checked"] == 4096
          assert report["rank_over_Q_from_spectrum"] == 10
          assert all(report["negative_controls"].values())
          assert report["formal_Lean_kernel_verification"] == "UNVERIFIED"
          print("SOURCE_SHA:", os.environ.get("GITHUB_SHA", "UNVERIFIED"))
          print("CERTIFICATE_SHA256:", report["receipt_sha256"])
          PY

      - name: Lean - parametric swap eigenvalues and q1-q4 spectral counts
        shell: bash
        run: |
          set -euo pipefail
          lean research/eth_repro/ParametricSpectrum.lean | tee /tmp/astra_parametric_lean.log
          if grep -Eq 'sorryAx|unknown axiom' /tmp/astra_parametric_lean.log; then
            echo "Unverified Lean axiom found"; exit 1
          fi
      - name: Parametric exact sparse spectrum and adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s research/eth_repro -p 'test_parametric_spectrum.py' -v
          python3 research/eth_repro/parametric_spectrum.py --output /tmp/astra_parametric_receipt.json > /tmp/astra_parametric_stdout.txt
          python3 - <<'PY'
          from pathlib import Path
          import json
          r=json.loads(Path("/tmp/astra_parametric_receipt.json").read_text())
          assert r["finite_computational_status"] == "PASS", r
          assert r["uniform_Lean_matrix_rank_proof"] == "UNVERIFIED"
          assert r["existing_ASTRA_q3_crosscheck"]["status"] == "PASS"
          assert all(r["negative_controls"].values())
          assert [r["finite_exhaustive_q_1_to_4"][str(q)]["predicted_rank"] for q in range(1,5)] == [0,1,10,67]
          print("PARAMETRIC_RANKS_Q1_Q4: 0,1,10,67")
          print("PARAMETRIC_Q5_PREDICTION:",r["symbolic_formula_arithmetic_q_1_to_12"]["5"]["rank_formula"])
          print("PARAMETRIC_RECEIPT_SHA256:",r["receipt_sha256"])
          PY

      - name: Projector Lean - arbitrary-length scalar identity and exact q3 matrix
        shell: bash
        run: |
          set -euo pipefail
          lean -o research/eth_repro/SpectralRankTen.olean research/eth_repro/SpectralRankTen.lean > /tmp/astra_spectral_dependency.log
          LEAN_PATH="research/eth_repro:${LEAN_PATH:-}" lean research/eth_repro/ProjectorSpectrum.lean | tee /tmp/astra_projector_lean.log
          if grep -Eq 'sorryAx|unknown axiom' /tmp/astra_projector_lean.log; then
            echo "FAIL: Lean output contains an unproved axiom"; exit 1
          fi
      - name: Projector sparse matrix preservation and adversarial controls
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s research/eth_repro -p 'test_projected_spectrum.py' -v
          python3 research/eth_repro/projected_spectrum.py --output /tmp/astra_projector_receipt.json > /tmp/astra_projector_stdout.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("/tmp/astra_projector_receipt.json").read_text())
          assert r["finite_status"]=="PASS",r
          assert r["uniform_Lean_Matrix_rank_proof"]=="UNVERIFIED"
          assert r["q3_original_exact_matrix_comparison"]["checked_entries"]==4096
          assert r["q3_original_exact_matrix_comparison"]["mismatches"]==0
          assert [r["q1_q4_modular_ranks"][str(q)]["filtered_rank"] for q in range(1,5)]==[0,1,10,66]
          assert all(r["negative_controls"].values())
          print("PROJECTED_RANKS_Q1_Q4: 0,1,10,66")
          print("PROJECTED_Q3_4096_ENTRIES_EQUAL: PASS")
          print("PROJECTED_RECEIPT_SHA256:",r["receipt_sha256"])
          PY
