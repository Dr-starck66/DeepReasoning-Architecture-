name: UNIVERSAL SKILLS Omega — cross-project catalog
on:
  push:
    branches: [main]
    paths:
      - 'universal-skills/scripts/**'
      - 'universal-skills/config/**'
      - '.github/workflows/universal-skills-omega.yml'
  pull_request:
    paths:
      - 'universal-skills/**'
      - '.github/workflows/universal-skills-omega.yml'
  workflow_dispatch:
    inputs:
      project:
        description: 'Generic public category ID or all'
        type: string
        required: false
        default: 'all'
      query:
        description: 'Optional non-confidential skill search'
        type: string
        required: false
        default: ''
  schedule:
    - cron: '37 7 * * 0'
permissions:
  contents: read
jobs:
  discover-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: universal-skills
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full engine and report adversarial tests
        run: |
          node --check scripts/universal-skill-intelligence.mjs
          node --check scripts/report-to-catalog.mjs
          node --test scripts/universal-skill-intelligence.test.mjs scripts/report-to-catalog.test.mjs scripts/public-repo-router.test.mjs
      - name: Live discovery (full coverage on push, PR and schedule)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_PROJECT: ${{ inputs.project || 'all' }}
          INPUT_QUERY: ${{ inputs.query || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          project="$INPUT_PROJECT"
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then project="all"; fi
          args=("--config=config/public-probe.json" "--project=$project" "--verifyTop=1" "--timeoutMs=9000" "--report=artifacts/public-proof/report.json" "--strict")
          if [ -n "$INPUT_QUERY" ]; then args+=("--query=$INPUT_QUERY"); fi
          node scripts/universal-skill-intelligence.mjs "${args[@]}"
      - name: Generate publishable catalog only from passing public evidence
        if: github.event_name != 'workflow_dispatch'
        run: node scripts/report-to-catalog.mjs artifacts/public-proof/report.json reports/latest.json CATALOG.md
      - name: Map public GitHub repositories to catalog recommendations
        if: github.event_name != 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/public-repo-router.mjs reports/latest.json reports/public-repos.json PUBLIC-REPOS.md
      - name: Keep proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universal-skills-audit
          path: |
            universal-skills/artifacts/public-proof/report.json
            universal-skills/reports/latest.json
            universal-skills/CATALOG.md
            universal-skills/PUBLIC-REPOS.md
            universal-skills/reports/public-repos.json
          if-no-files-found: warn
          retention-days: 14
  publish-catalog:
    needs: discover-and-test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: universal-skills-audit
          path: universal-skills
      - name: Commit validated public catalog to main
        run: |
          test -s universal-skills/reports/latest.json
          test -s universal-skills/CATALOG.md
          test -s universal-skills/PUBLIC-REPOS.md
          test -s universal-skills/reports/public-repos.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add universal-skills/reports/latest.json universal-skills/CATALOG.md universal-skills/reports/public-repos.json universal-skills/PUBLIC-REPOS.md
          if git diff --cached --quiet; then
            echo "Catalog unchanged"
          else
            git commit -m "docs: refresh evidence-based universal skills catalog [skip ci]"
            git push origin HEAD:main
          fi
