name: Universal Skills — applied SEO audit BetGPT
on:
  push:
    branches: [main]
    paths:
      - 'universal-skills/scripts/live-seo-audit*'
      - '.github/workflows/universal-skills-seo-pilot.yml'
  pull_request:
    paths:
      - 'universal-skills/scripts/live-seo-audit*'
      - '.github/workflows/universal-skills-seo-pilot.yml'
  workflow_dispatch:
  schedule:
    - cron: '11 8 * * 1'
permissions:
  contents: read
jobs:
  live-seo-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: universal-skills
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test pinned methodology checks
        run: |
          node --check scripts/live-seo-audit.mjs
          node --test scripts/live-seo-audit.test.mjs
      - name: Fetch real HTTPS SEO signals
        run: node scripts/live-seo-audit.mjs
      - name: Keep dated evidence even when FAIL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universal-skills-betgpt-seo
          path: universal-skills/artifacts/seo-pilot/
          if-no-files-found: warn
          retention-days: 14
  publish-proof:
    needs: live-seo-proof
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    concurrency:
      group: universal-skills-main-evidence-publishing
      cancel-in-progress: false
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: universal-skills-betgpt-seo
          path: universal-skills/seo-health
      - name: Validate evidence files and commit latest state
        run: |
          test -s universal-skills/seo-health/report.json
          test -s universal-skills/seo-health/report.md
          node -e "const x=require('./universal-skills/seo-health/report.json');if(x.schema!=='universal-skills/seo-pilot-v1'||x.status==='FAIL')process.exit(1)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add universal-skills/seo-health/report.json universal-skills/seo-health/report.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: refresh BetGPT SEO audit proof [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
