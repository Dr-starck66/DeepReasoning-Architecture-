name: ASTRA MATH LAB - Lean 4 formal check
on:
  pull_request:
    paths:
      - "research/eth_repro/PaperFinite.lean"
      - "research/eth_repro/LowRankExact.lean"
      - "research/eth_repro/RankTen.lean"
      - "research/eth_repro/math_research_engine.py"
      - "research/eth_repro/test_math_research_engine.py"
      - "research/eth_repro/rank10_proof_pipeline.py"
      - "research/eth_repro/rank10_immutable_audit.json"
      - "research/eth_repro/lowrank_exact.py"
      - "research/eth_repro/test_lowrank_exact.py"
      - "research/eth_repro/proof_gate.py"
      - "research/eth_repro/test_proof_gate.py"
      - "research/eth_repro/example_audit.json"
      - ".github/workflows/astra-eth-lean.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4 via elan (public standard runner, 0 EUR)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://elan.lean-lang.org/elan-init.sh -o /tmp/astra-elan-install.sh
          sh /tmp/astra-elan-install.sh -y --default-toolchain leanprover/lean4:v4.23.0 --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Lean kernel check (no sorry)
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          if grep -En '\\b(sorry|axiom|native_decide|unsafe)\\b' research/eth_repro/PaperFinite.lean | grep -v '^.*No sorry'; then
            echo 'Forbidden proof escape hatch'; exit 1
          fi
          lean research/eth_repro/PaperFinite.lean
          lean research/eth_repro/LowRankExact.lean
      - name: Python exact finite cross-checks (stdlib only)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s research/eth_repro -p 'test_*.py' -v
          python3 research/eth_repro/paper_exact.py

      - name: ASTRA rank-ten proof — Python + Lean + ProofGate local evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 research/eth_repro/rank10_proof_pipeline.py --output /tmp/astra-rank10-evidence.json
          python3 -c 'import json; r=json.load(open("/tmp/astra-rank10-evidence.json")); assert r["local_mathematical_status"] == "PASS" and r["lean_kernel"]["status"] == "PASS" and r["proof_gate"]["status"] == "PASS" and r["proof_gate"]["remote_ci_binding"] == "UNVERIFIED", r'

      - name: ProofGate immutable claim audit (live GitHub API)
        shell: bash
        run: |
          set -euo pipefail
          python3 research/eth_repro/proof_gate.py research/eth_repro/example_audit.json --output /tmp/astra_proof_gate_receipt.json
          python3 -c 'import json; x=json.load(open("/tmp/astra_proof_gate_receipt.json")); assert x["summary"]["PASS"] == 1 and x["summary"]["PARTIAL"] == 1 and x["summary"]["UNVERIFIED"] == 0 and x["summary"]["FAIL"] == 0, x["summary"]'

      - name: ProofGate independent immutable rank-ten attestation
        shell: bash
        run: |
          set -euo pipefail
          python3 research/eth_repro/proof_gate.py research/eth_repro/rank10_immutable_audit.json --output /tmp/astra-rank10-immutable.json
          python3 -c 'import json; r=json.load(open("/tmp/astra-rank10-immutable.json")); assert r["summary"] == {"PASS":1,"PARTIAL":0,"FAIL":0,"UNVERIFIED":0}, r["summary"]'
